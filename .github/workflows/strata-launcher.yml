name: Strata launcher

on:
  push:
    paths:
      - "strata-os/launcher/**"
      - ".github/workflows/strata-launcher.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: strata-launcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: strata-os/launcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk strata-launcher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: strata-launcher
          path: strata-os/launcher/strata-launcher.apk

      # A rolling pre-release so the newest APK is one tap away on the phone.
      - name: Publish the latest build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete strata-launcher-latest --yes --cleanup-tag || true
          gh release create strata-launcher-latest strata-launcher.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Strata launcher (latest build)" \
            --notes "Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. Download strata-launcher.apk on your phone and open it to install."
