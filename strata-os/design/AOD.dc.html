<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Strata OS · Always-on display</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000000}
a{color:#FFB547}a:hover{color:#FFD08A}
.ic{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.sl{fill:none;stroke-width:2}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #000000; color: #8A8F98; font-family: Inter, system-ui, sans-serif">

<svg viewBox="0 0 390 844" width="390" height="844" aria-hidden="true" style="position: absolute; left: 0; top: 0">
<path class="sl" d="M0 640 C 90 615 170 668 265 642 S 365 612 390 624" stroke="{{accent}}"></path>
</svg>

<div aria-hidden="true" style="position: absolute; left: 189px; top: 16px; width: 12px; height: 12px; border-radius: 6px; background: #000000; box-shadow: 0 0 0 1px #1A1C20"></div>

<div style="position: absolute; left: 32px; top: 168px; display: flex; flex-direction: column; gap: 10px">
<div style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 76px; line-height: 0.9; font-weight: 400; letter-spacing: -0.04em; color: #C9CCD1">08<span style="color: {{accent}}">:</span>47</div>
<div style="font-size: 15px; color: #8A8F98">Sun 25 Oct · 18°</div>
<div style="display: flex; align-items: center; gap: 14px; margin-top: 14px; color: #8A8F98">
<svg class="ic" viewBox="0 0 24 24" width="18" height="18" role="img" aria-label="Messages"><path d="M4 5h16v11H10l-5 4v-4H4z"></path></svg>
<svg class="ic" viewBox="0 0 24 24" width="18" height="18" role="img" aria-label="Mail"><path d="M3 6h18v12H3z M3 7l9 6 9-6"></path></svg>
<svg class="ic" viewBox="0 0 24 24" width="18" height="18" role="img" aria-label="Parcel update"><path d="M3 7l9-4 9 4v10l-9 4-9-4z M3 7l9 4 9-4 M12 11v10"></path></svg>
</div>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 26px; display: flex; flex-direction: column; align-items: center; gap: 14px">
<div aria-hidden="true" style="width: 68px; height: 68px; border-radius: 34px; border: 1px solid #2C3036; box-sizing: border-box"></div>
<span style="font-size: 12px; color: #8A8F98">82% · Tap to wake</span>
</div>

<a href="Main.dc.html" aria-label="Wake screen" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; display: block"></a>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FFB547","options":["#FFB547","#6ED3C1","#9DB4FF","#FF7A59"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#FFB547' };
  }
}
</script>
</body>
</html>
