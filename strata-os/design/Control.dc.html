<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Strata OS · Controls</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0B0D}
a{color:#FFB547}a:hover{color:#FFD08A}
.ic{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #0A0B0D; color: #F3F1EC; font-family: Inter, system-ui, sans-serif">

<div style="position: relative; height: 44px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 600">
<span>5G · 82%</span>
<div aria-hidden="true" style="position: absolute; left: 189px; top: 16px; width: 12px; height: 12px; border-radius: 6px; background: #000000; box-shadow: 0 0 0 1px #22252A"></div>
<svg viewBox="0 0 27 13" width="27" height="13" aria-hidden="true"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" fill="none" stroke="#8A8F98"></rect><rect x="2.5" y="2.5" width="16" height="8" rx="2" fill="#F3F1EC"></rect><rect x="25" y="4.5" width="2" height="4" rx="1" fill="#8A8F98"></rect></svg>
</div>

<div style="padding: 24px 24px 0; display: flex; align-items: flex-start; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 56px; line-height: 1; font-weight: 500; letter-spacing: -0.04em">08:47</span>
<span style="font-size: 14px; color: #A9ADB4">Sunday 25 October</span>
</div>
<a href="Home.dc.html" style="height: 40px; padding: 0 18px; border-radius: 20px; border: 1px solid #2C3036; background: #17191D; color: #F3F1EC; font-size: 14px; font-weight: 600; display: flex; align-items: center; text-decoration: none; margin-top: 8px">Done</a>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 620px; box-sizing: border-box; background: #141619; border-top: 1px solid #2C3036; border-radius: 32px 32px 0 0; padding: 10px 16px 0; display: flex; flex-direction: column">
<div aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #4A4F57"></div>

<div style="margin-top: 18px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{big}}" as="t" hint-placeholder-count="4">
<button type="button" role="switch" aria-checked="{{t.checked}}" onClick="{{t.toggle}}" style="height: 72px; border-radius: 22px; border: 0; background: {{t.bg}}; color: {{t.fg}}; font: inherit; padding: 0 14px; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer">
<span style="width: 40px; height: 40px; border-radius: 20px; background: {{t.dotBg}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg class="ic" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="{{t.d}}"></path></svg>
</span>
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="font-size: 14px; font-weight: 600">{{t.label}}</span>
<span style="font-size: 12px; color: {{t.subFg}}">{{t.sub}}</span>
</span>
</button>
</sc-for>
</div>

<div style="margin-top: 18px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); row-gap: 12px; column-gap: 4px">
<sc-for list="{{small}}" as="q" hint-placeholder-count="8">
<button type="button" role="switch" aria-checked="{{q.checked}}" onClick="{{q.toggle}}" style="background: none; border: 0; padding: 0; font: inherit; color: #A9ADB4; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer">
<span style="width: 56px; height: 56px; border-radius: 28px; background: {{q.bg}}; color: {{q.fg}}; display: flex; align-items: center; justify-content: center">
<svg class="ic" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="{{q.d}}"></path></svg>
</span>
<span style="font-size: 11px; line-height: 14px; min-height: 28px; text-align: center">{{q.label}}</span>
</button>
</sc-for>
</div>

<div style="margin-top: 18px; display: flex; flex-direction: column; gap: 10px">
<div style="position: relative; height: 52px; border-radius: 18px; background: #212429; overflow: hidden">
<div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{brightW}}; background: {{accent}}"></div>
<svg class="ic" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="position: absolute; left: 16px; top: 15px; color: #1A1306"><path d="{{icons.sun}}"></path></svg>
<input type="range" min="0" max="100" value="{{bright}}" onChange="{{setBright}}" aria-label="Brightness" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer">
</div>
<div style="position: relative; height: 52px; border-radius: 18px; background: #212429; overflow: hidden">
<div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{volW}}; background: {{accent}}"></div>
<svg class="ic" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="position: absolute; left: 16px; top: 15px; color: #1A1306"><path d="{{icons.volume}}"></path></svg>
<input type="range" min="0" max="100" value="{{vol}}" onChange="{{setVol}}" aria-label="Volume" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer">
</div>
</div>

<div style="margin-top: 14px; height: 44px; display: flex; align-items: center; justify-content: space-between">
<button type="button" style="height: 44px; padding: 0 4px; border: 0; background: none; color: #A9ADB4; font: inherit; font-size: 14px; cursor: pointer">Edit controls</button>
<a href="Privacy.dc.html" style="height: 44px; display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; color: {{accent}}; text-decoration: none">
Privacy and settings
<svg class="ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</a>
</div>

<div style="flex-grow: 1"></div>
<div aria-hidden="true" style="height: 26px; display: flex; align-items: center; justify-content: center">
<span style="width: 124px; height: 4px; border-radius: 2px; background: #F3F1EC"></span>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FFB547","options":["#FFB547","#6ED3C1","#9DB4FF","#FF7A59"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  icons() {
    return {
      wifi: 'M2.5 9a14 14 0 0 1 19 0 M5.5 12.5a9.5 9.5 0 0 1 13 0 M8.5 16a5 5 0 0 1 7 0 M12 19.5v.01',
      data: 'M7 20V8 M3 12l4-4 4 4 M17 4v12 M13 12l4 4 4-4',
      bluetooth: 'M7 7l10 10-5 4V3l5 4L7 17',
      moon: 'M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z',
      torch: 'M8 3h8v4l-2 3v11h-4V10L8 7z M12 13v2',
      rotate: 'M4 12a8 8 0 0 1 14-5.3 M20 12a8 8 0 0 1-14 5.3 M18 3v4h-4 M6 21v-4h4',
      location: 'M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z M9.5 9a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0-5 0z',
      hotspot: 'M8.5 15.5a5 5 0 0 1 0-7 M15.5 8.5a5 5 0 0 1 0 7 M5.5 18.5a9 9 0 0 1 0-13 M18.5 5.5a9 9 0 0 1 0 13 M11 12a1 1 0 1 0 2 0a1 1 0 1 0-2 0z',
      plane: 'M11.5 2a1.5 1.5 0 0 1 1.5 1.5V9l8 5v2l-8-2.5V18l2.5 2v1.5l-4-1-4 1V20l2.5-2v-4.5L2 16v-2l8-5V3.5A1.5 1.5 0 0 1 11.5 2z',
      leaf: 'M5 19c0-8 5-14 15-14c0 10-6 15-14 15 M5 19l7-7',
      cast: 'M3 8V5h18v14h-7 M3 19h.01 M3 15a4 4 0 0 1 4 4 M3 11a8 8 0 0 1 8 8',
      eye: 'M2 12s3.5-6 10-6s10 6 10 6s-3.5 6-10 6S2 12 2 12z M9 12a3 3 0 1 0 6 0a3 3 0 1 0-6 0z',
      sun: 'M8 12a4 4 0 1 0 8 0a4 4 0 1 0-8 0z M12 2v2 M12 20v2 M4.9 4.9l1.4 1.4 M17.7 17.7l1.4 1.4 M2 12h2 M20 12h2 M4.9 19.1l1.4-1.4 M17.7 6.3l1.4-1.4',
      volume: 'M4 9h4l5-4v14l-5-4H4z M16 9a4 4 0 0 1 0 6 M18.5 6.5a7.5 7.5 0 0 1 0 11'
    };
  }

  renderVals() {
    const accent = this.props.accent ?? '#FFB547';
    const I = this.icons();
    const st = this.state || {};
    const val = (k, dflt) => (st[k] === undefined ? dflt : st[k]);
    const flip = (k, dflt) => () => this.setState({ [k]: !val(k, dflt) });

    const big = [
      ['wifi', 'Wi-Fi', 'Home network', I.wifi, true],
      ['data', 'Mobile data', '5G', I.data, true],
      ['bt', 'Bluetooth', 'Earbuds connected', I.bluetooth, false],
      ['focus', 'Focus', 'Until 18:00', I.moon, false]
    ].map(([k, label, subOn, d, dflt]) => {
      const on = val(k, dflt);
      return {
        label,
        d,
        sub: on ? subOn : 'Off',
        checked: on,
        toggle: flip(k, dflt),
        bg: on ? accent : '#212429',
        fg: on ? '#1A1306' : '#F3F1EC',
        subFg: on ? '#4A3410' : '#A9ADB4',
        dotBg: on ? 'rgba(0, 0, 0, 0.12)' : '#2C3036'
      };
    });

    const small = [
      ['torch', 'Torch', I.torch, false],
      ['rotate', 'Rotation lock', I.rotate, true],
      ['loc', 'Location', I.location, true],
      ['hotspot', 'Hotspot', I.hotspot, false],
      ['plane', 'Airplane', I.plane, false],
      ['saver', 'Battery saver', I.leaf, false],
      ['cast', 'Cast', I.cast, false],
      ['comfort', 'Eye comfort', I.eye, false]
    ].map(([k, label, d, dflt]) => {
      const on = val(k, dflt);
      return {
        label,
        d,
        checked: on,
        toggle: flip(k, dflt),
        bg: on ? accent : '#212429',
        fg: on ? '#1A1306' : '#F3F1EC'
      };
    });

    const bright = val('bright', 64);
    const vol = val('vol', 38);
    return {
      accent,
      icons: I,
      big,
      small,
      bright,
      vol,
      brightW: Math.max(bright, 14) + '%',
      volW: Math.max(vol, 14) + '%',
      setBright: (e) => this.setState({ bright: Number(e.target.value) }),
      setVol: (e) => this.setState({ vol: Number(e.target.value) })
    };
  }
}
</script>
</body>
</html>
