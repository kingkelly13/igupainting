<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Strata OS · Lock screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0D0E10}
a{color:#FFB547}a:hover{color:#FFD08A}
.ic{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.sl{fill:none;stroke-width:2}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #0D0E10; color: #F3F1EC; font-family: Inter, system-ui, sans-serif">

<svg viewBox="0 0 390 844" width="390" height="844" aria-hidden="true" style="position: absolute; left: 0; top: 0">
<path d="M0 470 C 80 445 150 500 230 480 S 350 440 390 455 V 844 H 0 Z" fill="#111316"></path>
<path d="M0 560 C 70 540 160 590 250 565 S 360 530 390 545 V 844 H 0 Z" fill="#15181C"></path>
<path d="M0 640 C 90 615 170 668 265 642 S 365 612 390 624 V 844 H 0 Z" fill="#1A1D22"></path>
<path class="sl" d="M0 640 C 90 615 170 668 265 642 S 365 612 390 624" stroke="{{accent}}"></path>
<path d="M0 728 C 100 708 180 752 280 730 S 370 706 390 714 V 844 H 0 Z" fill="#1F2328"></path>
<path d="M0 796 C 110 780 190 815 290 798 S 372 782 390 788 V 844 H 0 Z" fill="#252A30"></path>
</svg>

<div style="position: relative; height: 44px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 600">
<div style="display: flex; align-items: center; gap: 6px">
<svg viewBox="0 0 18 12" width="18" height="12" aria-hidden="true"><rect x="0" y="8" width="3" height="4" rx="1" fill="#F3F1EC"></rect><rect x="5" y="5" width="3" height="7" rx="1" fill="#F3F1EC"></rect><rect x="10" y="2.5" width="3" height="9.5" rx="1" fill="#F3F1EC"></rect><rect x="15" y="0" width="3" height="12" rx="1" fill="#4A4F57"></rect></svg>
<span>5G</span>
</div>
<div aria-hidden="true" style="position: absolute; left: 189px; top: 16px; width: 12px; height: 12px; border-radius: 6px; background: #000000; box-shadow: 0 0 0 1px #22252A"></div>
<div style="display: flex; align-items: center; gap: 8px">
<svg class="ic" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M2.5 9a14 14 0 0 1 19 0 M5.5 12.5a9.5 9.5 0 0 1 13 0 M8.5 16a5 5 0 0 1 7 0 M12 19.5v.01"></path></svg>
<span>82</span>
<svg viewBox="0 0 27 13" width="27" height="13" aria-hidden="true"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" fill="none" stroke="#8A8F98"></rect><rect x="2.5" y="2.5" width="16" height="8" rx="2" fill="#F3F1EC"></rect><rect x="25" y="4.5" width="2" height="4" rx="1" fill="#8A8F98"></rect></svg>
</div>
</div>

<div style="position: relative; padding: 36px 28px 0; display: flex; flex-direction: column">
<div style="font-size: 15px; color: #A9ADB4; letter-spacing: 0.01em">Sunday 25 October</div>
<div style="display: flex; align-items: flex-end; justify-content: space-between; margin-top: 12px">
<div style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 132px; line-height: 0.86; font-weight: 500; letter-spacing: -0.05em; display: flex; flex-direction: column">
<span>08</span>
<span style="color: {{accent}}">47</span>
</div>
<div style="width: 138px; display: flex; flex-direction: column; gap: 18px; padding-bottom: 6px">
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: center; gap: 8px">
<svg class="ic" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M7 18h10a4 4 0 0 0 0-8a6 6 0 0 0-11.5 1.5A3.3 3.3 0 0 0 7 18z"></path></svg>
<span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 24px; font-weight: 500">18°</span>
</div>
<div style="font-size: 13px; line-height: 1.35; color: #A9ADB4">Cloudy, rain from 15:00</div>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: center; gap: 8px">
<svg class="ic" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 6h16v14H4z M4 10h16 M8 3v4 M16 3v4"></path></svg>
<span style="font-size: 15px; font-weight: 600">Standup</span>
</div>
<div style="font-size: 13px; line-height: 1.35; color: #A9ADB4">10:00 · Room 3</div>
</div>
</div>
</div>

<div style="margin-top: 40px; display: flex; flex-direction: column; gap: 12px">
<div style="background: #17191D; border: 1px solid #2C3036; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 12px">
<div style="width: 38px; height: 38px; border-radius: 19px; background: #212429; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg class="ic" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3 7l9-4 9 4v10l-9 4-9-4z M3 7l9 4 9-4 M12 11v10"></path></svg>
</div>
<div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
<span style="font-size: 15px; font-weight: 600">Parcel out for delivery</span>
<span style="font-size: 13px; color: #A9ADB4">Arrives 11:00–13:00</span>
</div>
<span style="font-size: 12px; font-weight: 600; color: {{accent}}">Live</span>
</div>
<div style="display: flex; align-items: center; gap: 12px">
<div style="flex-grow: 1; height: 6px; border-radius: 3px; background: #2C3036; position: relative; overflow: hidden">
<div style="position: absolute; left: 0; top: 0; bottom: 0; width: 68%; border-radius: 3px; background: {{accent}}"></div>
</div>
<span style="font-size: 12px; color: #A9ADB4">4 stops away</span>
</div>
</div>

<div style="background: #17191D; border: 1px solid #2C3036; border-radius: 22px; padding: 6px 16px">
<div style="display: flex; align-items: center; justify-content: space-between; height: 34px">
<span style="font-size: 13px; color: #A9ADB4">Notifications</span>
<span style="display: flex; align-items: center; gap: 5px; font-size: 12px; color: #A9ADB4">
<svg class="ic" viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><path d="M6 11h12v9H6z M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
Content hidden until unlock
</span>
</div>
<div style="display: flex; align-items: center; gap: 12px; height: 56px; border-top: 1px solid #2C3036">
<svg class="ic" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 5h16v11H10l-5 4v-4H4z"></path></svg>
<div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
<span style="font-size: 14px; font-weight: 600">Messages</span>
<span style="font-size: 13px; color: #A9ADB4">2 new from Alex</span>
</div>
<span style="font-size: 12px; color: #A9ADB4">now</span>
</div>
<div style="display: flex; align-items: center; gap: 12px; height: 56px; border-top: 1px solid #2C3036">
<svg class="ic" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3 6h18v12H3z M3 7l9 6 9-6"></path></svg>
<div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
<span style="font-size: 14px; font-weight: 600">Mail</span>
<span style="font-size: 13px; color: #A9ADB4">3 new, 1 flagged</span>
</div>
<span style="font-size: 12px; color: #A9ADB4">12 min</span>
</div>
</div>
</div>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 0 28px 26px; display: flex; flex-direction: column; align-items: center; gap: 12px">
<div style="width: 100%; display: flex; align-items: center; justify-content: space-between">
<button type="button" aria-label="Torch" style="width: 54px; height: 54px; border-radius: 27px; border: 1px solid #2C3036; background: #17191D; color: #F3F1EC; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
<svg class="ic" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M8 3h8v4l-2 3v11h-4V10L8 7z M12 13v2"></path></svg>
</button>
<a href="Home.dc.html" aria-label="Unlock with fingerprint" style="width: 68px; height: 68px; border-radius: 34px; border: 1.5px solid {{accent}}; background: #0D0E10; color: {{accent}}; display: flex; align-items: center; justify-content: center; text-decoration: none">
<svg class="ic" viewBox="0 0 24 24" width="32" height="32" aria-hidden="true"><path d="M12 11v3a8 8 0 0 1-1.5 4.5 M8.5 8.5A5 5 0 0 1 17 12v1.5 M6 12a6 6 0 0 1 .8-3 M7 15.5a11 11 0 0 0 .5-3.5 M17 16.5a13 13 0 0 1-.7 2.5 M14.5 12.5v1a10 10 0 0 1-1.5 5.5 M5 6.5A9 9 0 0 1 20.5 11"></path></svg>
</a>
<button type="button" aria-label="Camera" style="width: 54px; height: 54px; border-radius: 27px; border: 1px solid #2C3036; background: #17191D; color: #F3F1EC; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
<svg class="ic" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 8h4l2-3h6l2 3h4v11H3z M12 10a3.5 3.5 0 1 0 0 7a3.5 3.5 0 1 0 0-7z"></path></svg>
</button>
</div>
<span style="font-size: 12px; color: #A9ADB4">Touch the sensor to unlock</span>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FFB547","options":["#FFB547","#6ED3C1","#9DB4FF","#FF7A59"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#FFB547' };
  }
}
</script>
</body>
</html>
