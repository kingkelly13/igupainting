</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 8px">
<svg class="ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z M9.5 9a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0-5 0z"></path></svg>

<span style="position: absolute; top: 0; bottom: 0; left: 16.9%; width: 2%; border-radius: 3px; background: {{accent}}"></span>

<div style="margin: 18px 4px 8px; font-size: 13px; color: #A9ADB4">Defaults</div>
<div style="background: #17191D; border: 1px solid #2C3036; border-radius: 22px; padding: 4px 0">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
<button type="button" role="switch" aria-checked="{{r.checked}}" onClick="{{r.toggle}}" style="width: 100%; min-height: 66px; box-sizing: border-box; padding: 10px 16px 10px 18px; border: 0; border-top: 1px solid {{r.divider}}; background: none; color: #F3F1EC; font: inherit; display: flex; align-items: center; gap: 14px; text-align: left; cursor: pointer">
<span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0">
<span style="font-size: 14px; font-weight: 600; line-height: 1.3">{{r.label}}</span>
<span style="font-size: 12px; line-height: 1.35; color: #A9ADB4">{{r.hint}}</span>
</span>
<span style="width: 52px; height: 32px; flex-shrink: 0; box-sizing: border-box; border-radius: 16px; padding: 3px; background: {{r.track}}; display: flex; justify-content: {{r.justify}}">
<span style="width: 26px; height: 26px; border-radius: 13px; background: {{r.knob}}"></span>
</span>
</button>
</sc-for>
</div>

<button type="button" style="margin-top: 12px; height: 54px; border-radius: 18px; border: 1px solid #2C3036; background: #17191D; color: #F3F1EC; font: inherit; font-size: 14px; font-weight: 600; padding: 0 14px 0 18px; display: flex; align-items: center; justify-content: space-between; cursor: pointer">
Permissions by app
<svg class="ic" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="color: #A9ADB4"><path d="M9 6l6 6-6 6"></path></svg>
</button>
</div>

<div style="flex-grow: 1"></div>
<div aria-hidden="true" style="height: 26px; flex-shrink: 0; display: flex; align-items: center; justify-content: center">
<span style="width: 124px; height: 4px; border-radius: 2px; background: #F3F1EC"></span>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FFB547","options":["#FFB547","#6ED3C1","#9DB4FF","#FF7A59"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#FFB547';
    const st = this.state || {};
    const rows = [
      ['approx', 'Approximate location', 'Apps ask again for precise'],
      ['hide', 'Hide content when locked', 'Shows who, not what'],
      ['clip', 'Auto-clear clipboard', 'Wiped 60 s after copying'],
      ['local', 'On-device assistant', 'Requests never leave the phone']
    ].map(([k, label, hint], i) => {
      const on = st[k] === undefined ? true : st[k];
      return {
        label,
        hint,
        checked: on,
        toggle: () => this.setState({ [k]: !on }),
        divider: i === 0 ? 'transparent' : '#2C3036',
        track: on ? accent : '#2C3036',
        knob: on ? '#1A1306' : '#A9ADB4',
        justify: on ? 'flex-end' : 'flex-start'
      };
    });
    return { accent, rows };
  }
}
</script>
</body>
</html>
